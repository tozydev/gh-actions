name: Shared Gradle Build

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: The branch, tag, or SHA to checkout.
        required: false
        type: string
        default: ""

      java-version:
        description: Java JDK version to setup.
        required: false
        type: string
        default: "25"

      java-distribution:
        description: Java JDK distribution vendor.
        required: false
        type: string
        default: jetbrains

      gradle-args:
        description: Gradle task(s) and CLI arguments to execute.
        required: false
        type: string
        default: build

      build-script:
        description: Custom shell script to run instead of ./gradlew <gradle-args>.
        required: false
        type: string
        default: ""

      keystore-path:
        description: Destination path for decoded keystore file (defaults to runner.temp/release.keystore if empty).
        required: false
        type: string
        default: ""

      kotlin-js-cache:
        description: Package manager cache type for Kotlin/JS build ('', 'yarn', or 'npm').
        required: false
        type: string
        default: ""

      kotlin-js-cache-dependency-path:
        description: Glob pattern or path to Kotlin/JS lockfiles for cache hashing.
        required: false
        type: string
        default: .kotlin-locks/**/package-lock.json

      upload-artifacts-path:
        description: Newline-separated paths or glob patterns of artifacts to upload.
        required: false
        type: string
        default: ""

      upload-artifacts-name:
        description: Name for the uploaded artifact.
        required: false
        type: string
        default: build-artifacts

      env-vars:
        description: Multiline KEY=VALUE environment variables string for build step.
        required: false
        type: string
        default: ""

    secrets:
      github-token:
        description: GitHub token for authentication.
        required: false
      keystore-base64:
        description: Base64-encoded keystore secret string.
        required: false
      env-vars:
        description: Multiline KEY=VALUE secret environment variables string for build step.
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Prepare Local Environment File
        shell: bash
        # language=bash
        run: |
          cat << 'EOF' > "${{ runner.temp }}/.build_public.env"
          ${{ inputs.env-vars }}
          EOF
          cat << 'EOF' > "${{ runner.temp }}/.build_secret.env"
          ${{ secrets.env-vars }}
          EOF

          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            val=$(echo "$line" | cut -d'=' -f2-)
            echo "::add-mask::$val"
          done < "${{ runner.temp }}/.build_secret.env"

          cat "${{ runner.temp }}/.build_public.env" "${{ runner.temp }}/.build_secret.env" > "${{ runner.temp }}/.build.env"
          rm -f "${{ runner.temp }}/.build_public.env" "${{ runner.temp }}/.build_secret.env"

      - name: Setup Gradle
        uses: tozydev/gh-actions/setup-gradle@v1
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          github-token: ${{ secrets.github-token || github.token }}
          keystore-base64: ${{ secrets.keystore-base64 }}
          keystore-path: ${{ inputs.keystore-path || format('{0}/release.keystore', runner.temp) }}
          kotlin-js-cache: ${{ inputs.kotlin-js-cache }}
          kotlin-js-cache-dependency-path: ${{ inputs.kotlin-js-cache-dependency-path }}

      - name: Run Gradle Build Script
        if: inputs.build-script != ''
        shell: bash
        # language=bash
        run: |
          if [ -f "${{ runner.temp }}/.build.env" ]; then
            set -a
            source "${{ runner.temp }}/.build.env"
            set +a
          fi
          ${{ inputs.build-script }}

      - name: Run Gradle Build Tasks
        if: inputs.build-script == ''
        shell: bash
        # language=bash
        run: |
          if [ -f "${{ runner.temp }}/.build.env" ]; then
           set -a
           source "${{ runner.temp }}/.build.env"
           set +a
          fi
          ./gradlew ${{ inputs.gradle-args }}

      - name: Cleanup Environment File
        if: always()
        shell: bash
        run: |
          rm -f "${{ runner.temp }}/.build.env"

      - name: Upload Build Artifacts
        if: inputs.upload-artifacts-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifacts-name }}
          path: ${{ inputs.upload-artifacts-path }}
